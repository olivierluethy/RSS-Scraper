# ─────────────────────────────────────────────────────────────────────────────
#  RSS Watcher — configuration reference
#
#  Copy this file to `config.yaml` (which is git-ignored) and edit it, then run:
#      python -m rss_watcher --config config.yaml
#
#  Any value may reference an environment variable with ${VAR} or ${VAR:-default},
#  so secrets never have to be committed. A few settings can also be overridden
#  directly via env vars: NTFY_TOPIC, NTFY_SERVER, INTERVAL,
#  SUCHWOERTER (comma-separated), RSS_FEEDS (comma-separated).
# ─────────────────────────────────────────────────────────────────────────────

# Seconds between polling cycles.
interval: 240

# Newest entries per feed to scan each cycle.
max_entries: 15

# Send a low-priority "still alive, no hits" ping when a cycle finds nothing.
status_ping: false

fetch:
  connect_timeout: 5      # seconds to establish a connection (issue #13)
  read_timeout: 10        # seconds to read the response (issue #13)
  concurrency: 10         # feeds fetched in parallel (issue #11)
  conditional_get: true   # skip unchanged feeds via ETag/Last-Modified (issue #12)

matching:
  # Fields to search: any of title, summary, category.
  fields: [title]
  # Default match mode: substring | word | regex.
  mode: substring
  case_sensitive: false
  # Keywords may be plain strings, or mappings with per-keyword overrides:
  #   - text: helvetus
  #     mode: word          # avoid matching inside a larger word
  #     priority: urgent     # per-keyword notification priority
  #     fields: [title, summary]
  keywords:
    - helvetus
    - stralium

storage:
  path: seen.sqlite3        # persistent de-dup store (issues #2, #7)
  ttl_days: 30              # expire entries older than N days to bound size

# One or more notification backends; alerts fan out to all of them (issue #10).
notifiers:
  - type: ntfy
    server: https://ntfy.sh
    topic: ${NTFY_TOPIC}    # keep the topic out of source (issue #3)
    default_priority: high

  # - type: email
  #   smtp_host: smtp.example.com
  #   smtp_port: 587
  #   from: alerts@example.com
  #   to: [me@example.com]
  #   username: ${SMTP_USER}
  #   password: ${SMTP_PASS}

  # - type: telegram
  #   bot_token: ${TELEGRAM_BOT_TOKEN}
  #   chat_id: ${TELEGRAM_CHAT_ID}

  # - type: slack
  #   webhook_url: ${SLACK_WEBHOOK_URL}

  # - type: discord
  #   webhook_url: ${DISCORD_WEBHOOK_URL}

