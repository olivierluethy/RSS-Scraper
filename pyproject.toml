[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-watcher"
version = "1.0.0"
description = "A configurable RSS keyword watcher with pluggable push notifications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Olivier Luethy" }]
keywords = ["rss", "feed", "watcher", "notifications", "ntfy"]
dependencies = [
    "feedparser>=6.0",
    "requests>=2.25",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/olivierluethy/RSS-Scraper"
Issues = "https://github.com/olivierluethy/RSS-Scraper/issues"

[project.scripts]
rss-watcher = "rss_watcher.watcher:main"

[tool.setuptools]
packages = ["rss_watcher", "rss_watcher.notifiers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
